[project]
name = "wisprsight"
version = "0.1.0"
description = "Local camera-based silent dictation and personal calibration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=1.26,<2",
  "torch>=2.6,<3",
  "mediapipe==0.10.21",
  "opencv-python>=4.9,<4.11",
  "av>=14,<19",
  "sentencepiece>=0.2,<1",
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.30,<1",
  "cryptography>=44",
  "certifi>=2025",
]

[project.scripts]
wisprsight = "wisprsight.__main__:main"

[dependency-groups]
export = ["onnx==1.17.0", "onnxruntime>=1.21,<2"]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wisprsight", "vendor/lipflow", "vendor/espnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
